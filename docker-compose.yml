services:
  app:
    build: .
    container_name: itnote-demo-app
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      OCR_ENDPOINT_URL: "${OCR_ENDPOINT_URL:-http://ocr:8090/ocr}"
    restart: unless-stopped

  ocr:
    build: ./services/ocr
    container_name: itnote-demo-ocr
    profiles: ["ocr"]
    ports:
      - "8090:8090"
    restart: unless-stopped
